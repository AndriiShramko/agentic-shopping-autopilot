# Hosts the runtime may act on in addition to *.allegro.pl and *.payu.com (runtime/src/allowlist.ts).
# The Allegro Pay host is recorded here during the first checkout recording (`asa selectors:domain HOST`).
# The bank's 3DS page is deliberately NOT listed: during a challenge the runtime neither reads nor clicks.
domains: []

endpoints:
  # API channel (fast path for search): OAuth2 device flow + GET /offers/listing, implemented in runtime/src/api.ts
  search: "GET https://api.allegro.pl/offers/listing  # scope after app verification; otherwise SERP"
  bid: "PUT https://api.allegro.pl/bidding/offers/{offerId}/bid  # auctions, scope allegro:api:bids (out of MVP scope)"
  oauth: "device flow: https://allegro.pl/auth/oauth/device"
